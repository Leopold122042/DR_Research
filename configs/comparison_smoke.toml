# Engineering smoke: the complete method with deliberately small training data.
# Scientific performance claims require comparison.toml and independent testing.
schema_version = 2
master_seed = 42
[control]
window_steps = 48
safety_window_steps = 48
time_limit_s = 60.0
solver_method = "highs-ipm"
solver_threads = 1
torch_threads = 1
candidate_count = 8
max_continuation_attempts = 8
[data]
train_weeks = [0]
validation_weeks = [8]
test_weeks = [10]
train_scales = ["S1"]
test_scales = ["S1"]
sample_stride = 112
label_candidates = 3
sampling_count = 8
[training]
epochs = 2
batch_size = 4
patience = 2
weight_decay = 0.00001
hidden_dims = [16]
latent_dims = [4]
learning_rates = [0.001]
coarse_widths = [1]
coarse_epochs = 1
coarse_warmup_epochs = 1
temperatures = [0.2]
error_epochs = 2
[refinement]
mode = "adaptive"
time_budget_s = 1.5
shortlist_size = 8
coverage_count = 2
group_size = 64
max_rounds = 16
reserve_s = 0.001
[evaluation]
repeats = 1
